<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fraction Lab</title>
  <meta name="theme-color" content="#F3EEFF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%235B3FB5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <header class="top">
      <div class="top-row">
        <nav class="tracker" id="tracker" aria-label="Lesson parts"></nav>
        <button id="soundBtn" class="sound-btn" aria-pressed="false">Sound off</button>
      </div>
      <p class="now-line" id="nowLine"></p>
    </header>

    <section class="tutor">
      <div id="avatar" class="avatar"></div>
      <div id="bubble" class="bubble" aria-live="polite"></div>
    </section>

    <main id="card" class="card"></main>

    <section id="inputArea" class="input-area" hidden></section>

    <footer class="bottom">
      <button id="backBtn" class="btn secondary">Back</button>
      <button id="nextBtn" class="btn primary">Next</button>
    </footer>

  </div>
  <script src="script.js"></script>
</body>
</html>
